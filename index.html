<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spectral Drift — Generative Art</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark:       #141413;
            --anthropic-light:      #faf9f5;
            --anthropic-mid-gray:   #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange:     #d97757;
            --anthropic-blue:       #6a9bcc;
            --anthropic-green:      #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        /* ── Sidebar ── */
        .sidebar {
            width: 300px;
            flex-shrink: 0;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20,20,19,0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 12.5px;
            margin-bottom: 28px;
            line-height: 1.55;
        }

        .control-section { margin-bottom: 28px; }

        .control-section h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-size: 18px;
        }

        /* Seed */
        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 10px 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
            color: var(--anthropic-dark);
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217,119,87,0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        /* Controls */
        .control-group { margin-bottom: 16px; }

        .control-group label {
            display: block;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 15px;
            height: 15px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
            min-width: 44px;
            text-align: right;
        }

        /* Colors */
        .color-group { margin-bottom: 14px; }

        .color-group label {
            display: block;
            font-size: 11.5px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 5px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .color-picker-container input[type="color"] {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: var(--anthropic-mid-gray);
        }

        /* Buttons */
        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 9px 14px;
            border-radius: 7px;
            font-family: 'Poppins', sans-serif;
            font-size: 12.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.18s;
            width: 100%;
            margin-bottom: 7px;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }

        .button.secondary {
            background: var(--anthropic-blue);
            margin-bottom: 0;
        }
        .button.secondary:hover { background: #5a8bbc; }

        .button.muted {
            background: var(--anthropic-light-gray);
            color: var(--anthropic-dark);
        }
        .button.muted:hover { background: var(--anthropic-mid-gray); color: white; }

        .button.green {
            background: var(--anthropic-green);
        }
        .button.green:hover { background: #6a7c50; }

        .btn-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        /* Canvas */
        .canvas-area {
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        #canvas-container {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(20,20,19,0.3);
            line-height: 0;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-width: 800px;
        }

        .loading {
            width: 800px;
            height: 800px;
            background: #0d0c0b;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            font-size: 13px;
            letter-spacing: 0.04em;
        }

        @media (max-width: 700px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .loading { width: 100%; height: 60vw; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ── Sidebar ── -->
    <div class="sidebar">
        <h1>Spectral Drift</h1>
        <p class="subtitle">
            Multiple wave sources. Atmospheric turbulence. The interference
            field between them — made visible.
        </p>

        <!-- Seed -->
        <div class="control-section">
            <h3>Seed</h3>
            <input type="number" id="seed-input" class="seed-input"
                   value="12345" min="1" onchange="updateSeed()">
            <div class="seed-controls">
                <button class="button secondary" onclick="previousSeed()">← Prev</button>
                <button class="button secondary" onclick="nextSeed()">Next →</button>
            </div>
            <button class="button green" onclick="randomSeedAndUpdate()">↻ Random</button>
        </div>

        <!-- Parameters -->
        <div class="control-section">
            <h3>Parameters</h3>

            <div class="control-group">
                <label>Sources</label>
                <div class="slider-container">
                    <input type="range" id="emitterCount" min="2" max="9" step="1" value="5"
                           oninput="updateParamReinit('emitterCount', parseInt(this.value))">
                    <span class="value-display" id="emitterCount-value">5</span>
                </div>
            </div>

            <div class="control-group">
                <label>Frequency</label>
                <div class="slider-container">
                    <input type="range" id="frequency" min="0.005" max="0.04" step="0.001" value="0.015"
                           oninput="updateParamLive('frequency', parseFloat(this.value))">
                    <span class="value-display" id="frequency-value">0.015</span>
                </div>
            </div>

            <div class="control-group">
                <label>Propagation Speed</label>
                <div class="slider-container">
                    <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0"
                           oninput="updateParamLive('speed', parseFloat(this.value))">
                    <span class="value-display" id="speed-value">1.0</span>
                </div>
            </div>

            <div class="control-group">
                <label>Turbulence</label>
                <div class="slider-container">
                    <input type="range" id="distortion" min="0" max="4.0" step="0.1" value="1.2"
                           oninput="updateParamLive('distortion', parseFloat(this.value))">
                    <span class="value-display" id="distortion-value">1.2</span>
                </div>
            </div>

            <div class="control-group">
                <label>Turbulence Scale</label>
                <div class="slider-container">
                    <input type="range" id="noiseScale" min="0.001" max="0.012" step="0.0005" value="0.003"
                           oninput="updateParamLive('noiseScale', parseFloat(this.value))">
                    <span class="value-display" id="noiseScale-value">0.003</span>
                </div>
            </div>

            <div class="control-group">
                <label>Resolution</label>
                <div class="slider-container">
                    <input type="range" id="cellSize" min="2" max="10" step="1" value="4"
                           oninput="updateParamReinit('cellSize', parseInt(this.value))">
                    <span class="value-display" id="cellSize-value">4</span>
                </div>
            </div>
        </div>

        <!-- Colors -->
        <div class="control-section">
            <h3>Colors</h3>

            <div class="color-group">
                <label>Constructive Peak</label>
                <div class="color-picker-container">
                    <input type="color" id="warmColor" value="#d97757"
                           oninput="updateColor('warmColor', this.value)">
                    <span class="color-value" id="warmColor-value">#d97757</span>
                </div>
            </div>

            <div class="color-group">
                <label>Destructive Trough</label>
                <div class="color-picker-container">
                    <input type="color" id="coolColor" value="#6a9bcc"
                           oninput="updateColor('coolColor', this.value)">
                    <span class="color-value" id="coolColor-value">#6a9bcc</span>
                </div>
            </div>

            <div class="color-group">
                <label>Background</label>
                <div class="color-picker-container">
                    <input type="color" id="bgColor" value="#0d0c0b"
                           oninput="updateColor('bgColor', this.value)">
                    <span class="color-value" id="bgColor-value">#0d0c0b</span>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="control-section">
            <h3>Actions</h3>
            <button class="button" onclick="resetParameters()">Reset Defaults</button>
            <div class="btn-row">
                <button class="button secondary" onclick="togglePause()">⏸ Pause</button>
                <button class="button muted" onclick="doSaveCanvas()">↓ PNG</button>
            </div>
        </div>
    </div>

    <!-- ── Canvas ── -->
    <div class="canvas-area">
        <div id="canvas-container">
            <div class="loading" id="loading-msg">Initializing wave field…</div>
        </div>
    </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// SPECTRAL DRIFT — Interference Field with Atmospheric Turbulence
//
// Conceptual soul: multiple RF sources emitting coherent wavefronts,
// their superposition made visible. Tropospheric turbulence (Perlin noise)
// distorts the phase of propagating wavefronts — a phenomenon any
// licensed radio operator would recognize as multipath scatter.
// ═══════════════════════════════════════════════════════════════════════

const CANVAS_SIZE = 800;

let params = {
    seed:         12345,
    emitterCount: 5,
    frequency:    0.015,
    speed:        1.0,
    distortion:   1.2,
    noiseScale:   0.003,
    cellSize:     4,
    warmColor:    '#d97757',
    coolColor:    '#6a9bcc',
    bgColor:      '#0d0c0b'
};

const DEFAULT_PARAMS = {...params};

// Parsed RGB triples for blending
let warmRGB = hexToRGB(params.warmColor);
let coolRGB = hexToRGB(params.coolColor);
let bgRGB   = hexToRGB(params.bgColor);

// Runtime state
let emitters   = [];   // [{x, y, phase, detune}]
let distGrid   = null; // Float32Array: precomputed distances
let t          = 0;
let paused     = false;
let pauseBtn   = null;

// ── Helpers ──────────────────────────────────────────────────────────

function hexToRGB(hex) {
    const h = hex.replace('#', '');
    return {
        r: parseInt(h.slice(0,2), 16),
        g: parseInt(h.slice(2,4), 16),
        b: parseInt(h.slice(4,6), 16)
    };
}

function lerpVal(a, b, v) { return a + (b - a) * v; }

// ── p5.js entry points ───────────────────────────────────────────────

function setup() {
    const cnv = createCanvas(CANVAS_SIZE, CANVAS_SIZE);
    cnv.parent('canvas-container');
    pixelDensity(1);
    frameRate(30);
    document.getElementById('loading-msg').style.display = 'none';
    pauseBtn = document.querySelector('.button.secondary[onclick*="togglePause"]');
    initializeSystem();
}

function draw() {
    if (paused) return;
    renderField();
    t++;
}

// ── Core algorithm ───────────────────────────────────────────────────

function initializeSystem() {
    randomSeed(params.seed);
    noiseSeed(params.seed);
    t = 0;
    emitters = [];

    const margin = CANVAS_SIZE * 0.12;
    for (let i = 0; i < params.emitterCount; i++) {
        emitters.push({
            x:      random(margin, CANVAS_SIZE - margin),
            y:      random(margin, CANVAS_SIZE - margin),
            phase:  random(TWO_PI),
            detune: random(-0.04, 0.04)   // slight frequency detuning per source
        });
    }

    precomputeDistances();
}

function precomputeDistances() {
    const cell = Math.max(1, params.cellSize);
    const cols = Math.ceil(CANVAS_SIZE / cell);
    const rows = Math.ceil(CANVAS_SIZE / cell);
    const n    = params.emitterCount;

    distGrid = new Float32Array(rows * cols * n);

    for (let row = 0; row < rows; row++) {
        const cy = row * cell + cell * 0.5;
        for (let col = 0; col < cols; col++) {
            const cx  = col * cell + cell * 0.5;
            const base = (row * cols + col) * n;
            for (let e = 0; e < emitters.length; e++) {
                const dx = cx - emitters[e].x;
                const dy = cy - emitters[e].y;
                distGrid[base + e] = Math.sqrt(dx * dx + dy * dy);
            }
        }
    }
}

function renderField() {
    const cell   = Math.max(1, params.cellSize);
    const cols   = Math.ceil(CANVAS_SIZE / cell);
    const rows   = Math.ceil(CANVAS_SIZE / cell);
    const n      = emitters.length;

    const tSpeed = t * params.speed * 0.038;
    const tDrift = t * 0.00022;
    const ns     = params.noiseScale;
    const dist   = params.distortion;
    const freq   = params.frequency;

    loadPixels();

    for (let row = 0; row < rows; row++) {
        const py = row * cell;
        const cy = py + cell * 0.5;

        for (let col = 0; col < cols; col++) {
            const px  = col * cell;
            const cx  = px + cell * 0.5;
            const dBase = (row * cols + col) * n;

            // ── Atmospheric distortion (two offset noise planes) ──
            const nx1 = noise(cx * ns,         cy * ns,         tDrift)       - 0.5;
            const nx2 = noise(cx * ns + 83.7,  cy * ns + 61.2,  tDrift + 0.5) - 0.5;
            const dPhase = (nx1 + nx2) * dist * Math.PI;

            // ── Interference summation ──
            let sum = 0;
            for (let e = 0; e < n; e++) {
                const d   = distGrid[dBase + e];
                const ef  = freq * (1.0 + emitters[e].detune);
                const att = 1.0 / (1.0 + d * 0.0011);
                const wav = Math.sin(d * ef - tSpeed + emitters[e].phase + dPhase);
                sum += wav * att;
            }
            sum /= n;  // ≈ [-1, 1]

            // ── Color mapping: bg → warm (positive) / cool (negative) ──
            let r, g, b;
            if (sum >= 0) {
                const v = Math.pow(Math.min(sum * 1.6, 1.0), 0.72);
                r = Math.round(lerpVal(bgRGB.r, warmRGB.r, v));
                g = Math.round(lerpVal(bgRGB.g, warmRGB.g, v));
                b = Math.round(lerpVal(bgRGB.b, warmRGB.b, v));
            } else {
                const v = Math.pow(Math.min(-sum * 1.6, 1.0), 0.72);
                r = Math.round(lerpVal(bgRGB.r, coolRGB.r, v));
                g = Math.round(lerpVal(bgRGB.g, coolRGB.g, v));
                b = Math.round(lerpVal(bgRGB.b, coolRGB.b, v));
            }

            // ── Write pixels for this cell ──
            const endCol = Math.min(px + cell, CANVAS_SIZE);
            const endRow = Math.min(py + cell, CANVAS_SIZE);
            for (let y = py; y < endRow; y++) {
                let idx = (y * CANVAS_SIZE + px) * 4;
                for (let x = px; x < endCol; x++) {
                    pixels[idx]     = r;
                    pixels[idx + 1] = g;
                    pixels[idx + 2] = b;
                    pixels[idx + 3] = 255;
                    idx += 4;
                }
            }
        }
    }

    updatePixels();
}

// ── Parameter handlers ───────────────────────────────────────────────

function updateParamLive(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent =
        Number.isInteger(value) ? value : value.toFixed(
            name === 'noiseScale' ? 4 : (name === 'frequency' ? 3 : 1)
        );
}

function updateParamReinit(name, value) {
    params[name] = value;
    document.getElementById(name + '-value').textContent = value;
    initializeSystem();
}

function updateColor(id, value) {
    params[id] = value;
    document.getElementById(id + '-value').textContent = value;
    if (id === 'warmColor') warmRGB = hexToRGB(value);
    if (id === 'coolColor') coolRGB = hexToRGB(value);
    if (id === 'bgColor')   bgRGB   = hexToRGB(value);
}

// ── Seed controls ─────────────────────────────────────────────────────

function updateSeedDisplay() {
    document.getElementById('seed-input').value = params.seed;
}

function updateSeed() {
    const v = parseInt(document.getElementById('seed-input').value);
    if (v && v > 0) { params.seed = v; initializeSystem(); }
    else { updateSeedDisplay(); }
}

function previousSeed() {
    params.seed = Math.max(1, params.seed - 1);
    updateSeedDisplay(); initializeSystem();
}

function nextSeed() {
    params.seed++;
    updateSeedDisplay(); initializeSystem();
}

function randomSeedAndUpdate() {
    params.seed = Math.floor(Math.random() * 999999) + 1;
    updateSeedDisplay(); initializeSystem();
}

// ── Actions ───────────────────────────────────────────────────────────

function togglePause() {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Resume' : '⏸ Pause';
}

function doSaveCanvas() {
    saveCanvas('spectral-drift-' + params.seed, 'png');
}

function resetParameters() {
    params = {...DEFAULT_PARAMS};

    warmRGB = hexToRGB(params.warmColor);
    coolRGB = hexToRGB(params.coolColor);
    bgRGB   = hexToRGB(params.bgColor);

    // Restore sliders
    const sliders = ['emitterCount','frequency','speed','distortion','noiseScale','cellSize'];
    sliders.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            el.value = params[id];
            document.getElementById(id + '-value').textContent = params[id];
        }
    });

    // Restore colors
    ['warmColor','coolColor','bgColor'].forEach(id => {
        document.getElementById(id).value = params[id];
        document.getElementById(id + '-value').textContent = params[id];
    });

    if (paused) { paused = false; if (pauseBtn) pauseBtn.textContent = '⏸ Pause'; }

    updateSeedDisplay();
    initializeSystem();
}
